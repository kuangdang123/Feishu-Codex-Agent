services:
  agent:
    build: .
    container_name: feishu-codex-agent
    init: true
    restart: unless-stopped
    env_file:
      - .env.lark
      - .env
    environment:
      DATA_DIR: /data
      WORKSPACE_ROOT: /data/workspaces
      CODEX_HOME: /home/node/.codex
    volumes:
      - agent-data:/data
      - codex-home:/home/node/.codex
    ports:
      - "127.0.0.1:3000:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  agent-data:
  codex-home:
